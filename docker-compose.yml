# Created by Metrum AI for Solidigm

# Sports Analytics Platform - Production Docker Compose
# All services start from: docker compose up -d

services:
  # ============================================
  # TIER 1: INFRASTRUCTURE SERVICES
  # ============================================

  postgres:
    image: postgres:16.4-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=sports_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================
  # TIER 2: ML SERVICES (GPU-ACCELERATED)
  # ============================================
  #
  # Options for running vLLM with Dynamo KVBM KV offload:
  #   1. Docker (default): Uses NGC Dynamo vLLM runtime image
  #   2. Native: Run ./start_vllm_native.sh (faster startup, uses host env)
  #
  # To use native mode, comment out vllm-lmcache and vllm-baseline services
  # and update API environment to use host.docker.internal URLs
  # ============================================

  # LLM with LMCache KV Offload (GPU 0) - Dynamo runtime (NGC pre-built image)
  vllm-lmcache:
    build:
      context: .
      dockerfile: docker/Dockerfile.vllm-dynamo
    image: vllm-dynamo:blackwell
    pull_policy: never
    container_name: vllm-lmcache
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - PYTHONHASHSEED=0
      # LMCache KV cache offloading config
      - LMCACHE_CONFIG_FILE=/app/configs/lmcache_config.yaml
    volumes:
      - ${KV_CACHE_PATH:-/mnt/ssd/kv_cache}:${KV_CACHE_PATH:-/mnt/ssd/kv_cache}
      - huggingface_cache:/root/.cache/huggingface
      - ./configs/lmcache_config.yaml:/app/configs/lmcache_config.yaml:ro
    command:
      - aws-prototyping/MegaBeam-Mistral-7B-300k
      - --port=8000
      - --max-model-len=200000
      - --gpu-memory-utilization=0.45
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser=openai
      - --trust-remote-code

      - --kv-transfer-config
      - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 900s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # LLM Baseline - No KV Offload (GPU 1)
  # Shares the vllm-dynamo:blackwell image with vllm-lmcache — same binary,
  # same model, difference is purely in command args (no --kv-transfer-config).
  # pull_policy: never prevents accidental Docker Hub pulls for this local image.
  # build: ensures the image is built automatically on a fresh machine.
  vllm-baseline:
    build:
      context: .
      dockerfile: docker/Dockerfile.vllm-dynamo
    image: vllm-dynamo:blackwell
    pull_policy: never
    container_name: vllm-baseline
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - aws-prototyping/MegaBeam-Mistral-7B-300k
      - --port=8000
      - --max-model-len=200000
      - --gpu-memory-utilization=0.45
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser=openai
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # VLM for Video Frame Analysis (GPU 2)
  vllm-vlm:
    image: vllm/vllm-openai:cu130-nightly
    container_name: vllm-vlm
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LD_LIBRARY_PATH=/lib/x86_64-linux-gnu:/usr/local/cuda/lib64
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command:
      - --model=Qwen/Qwen3-VL-30B-A3B-Thinking
      - --port=8000
      - --max-model-len=32768
      - --gpu-memory-utilization=0.9
      - --trust-remote-code
      - --limit-mm-per-prompt
      - '{"image":5}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================
  # TIER 3: MONITORING SERVICES
  # ============================================

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.external-url=http://localhost:8100/prometheus/
      - --web.route-prefix=/prometheus/
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
    container_name: dcgm-exporter
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ============================================
  # TIER 4: APPLICATION SERVICES
  # ============================================

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sports-analytics-api
    runtime: nvidia
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sports_analytics
      - VLM_API_URL=http://vllm-vlm:8000/v1
      - VLM_MODEL=Qwen/Qwen3-VL-30B-A3B-Thinking
      # Docker vLLM services (built with Blackwell support)
      - LLM_LMCACHE_URL=http://vllm-lmcache:8000/v1
      - LLM_BASELINE_URL=http://vllm-baseline:8000/v1
      - LLM_MODEL=aws-prototyping/MegaBeam-Mistral-7B-300k
      - PROMETHEUS_URL=http://prometheus:9090/prometheus
      - NODE_EXPORTER_URL=http://node-exporter:9100
      - DATA_PATH=/data
      - LOGS_PATH=/logs
      - NVIDIA_VISIBLE_DEVICES=all
      # SSD device name — single source of truth from .env
      - LMCACHE_SSD_DEVICE=${SSD_DEVICE:-nvme0n1}
      - BENCHMARK_ACTIVE_DISK_DEVICE=${SSD_DEVICE:-nvme0n1}
      # Multi-user benchmark (k6 Docker orchestration)
      - BENCHMARK_HOST_DATA_DIR=${BENCHMARK_HOST_DATA_DIR}
      - K6_DOCKER_IMAGE=${K6_DOCKER_IMAGE:-soln-k6-sse}
      - K6_DOCKER_NETWORK=${K6_DOCKER_NETWORK}
      - BENCHMARK_MAX_DURATION=${BENCHMARK_MAX_DURATION:-172800s}
      - BENCHMARK_SSE_TIMEOUT=${BENCHMARK_SSE_TIMEOUT:-900s}
      - BENCHMARK_TERMINAL_GRACE_SECONDS=${BENCHMARK_TERMINAL_GRACE_SECONDS:-20}
    volumes:
      - ./data:/data
      - ./videos:/videos:ro
      - ./logs:/logs
      - /home/fgpu:/host/home/fgpu:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/k6_benchmark_template.js:/app/configs/k6_benchmark_template.js:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
    container_name: sports-analytics-ui
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sports-analytics-nginx
    ports:
      - "8100:8100"
    volumes:
      - ./nginx/sports_analytics.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================
  # BENCHMARK: k6 with xk6-sse
  # ============================================

  k6-sse:
    build:
      context: .
      dockerfile: docker/Dockerfile.k6
    image: soln-k6-sse
    profiles: ["benchmark"]

volumes:
  postgres_data:
  huggingface_cache:
  pip_cache:
  prometheus_data:
  grafana_data:
