# Created by Metrum AI for Solidigm

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "dcgm-exporter"
    scrape_interval: 2s
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: "vllm-lmcache"
    scrape_interval: 2s
    static_configs:
      - targets: ["vllm-lmcache:8000"]
    metrics_path: /metrics

  - job_name: "vllm-baseline"
    scrape_interval: 2s
    static_configs:
      - targets: ["vllm-baseline:8000"]
    metrics_path: /metrics

  - job_name: "vllm-vlm"
    scrape_interval: 2s
    static_configs:
      - targets: ["vllm-vlm:8000"]
    metrics_path: /metrics

  # Mistral benchmark targets
  - job_name: "vllm-mistral-offload"
    scrape_interval: 2s
    static_configs:
      - targets: ["vllm-mistral-offload:8000"]
    metrics_path: /metrics

  - job_name: "vllm-mistral-baseline"
    scrape_interval: 2s
    static_configs:
      - targets: ["vllm-mistral-baseline:8000"]
    metrics_path: /metrics
