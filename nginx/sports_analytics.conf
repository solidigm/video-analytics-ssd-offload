# Created by Metrum AI for Solidigm

server {
    listen 8100 default_server;
    server_name _;

    # Docker embedded DNS — re-resolve on every request
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 500M;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Common proxy headers (inherited by all location blocks)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Friendly error page for upstream failures
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Benchmark SSE stream — long-lived; needs extended read timeout
    # so nginx doesn't kill the stream mid-benchmark (default 300s would fire).
    location /api/v1/benchmark/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";

        # Allow up to 48 hours for a benchmark run to complete
        proxy_read_timeout 172800s;
        proxy_send_timeout 172800s;
    }

    # API — variable-based proxy_pass forces DNS re-resolution
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        # SSE / streaming support
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
    }

    location /docs {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location /redoc {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location /openapi.json {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    location /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    # Prometheus UI — Prometheus is configured with --web.route-prefix=/prometheus/
    # so it handles all routes under /prometheus/ natively; no rewrite needed
    location /prometheus/ {
        set $prom http://prometheus:9090;
        proxy_pass $prom;
    }

    # Platform metrics shorthand for applications: /metrics/<name> → /api/v1/metrics/<name>
    # e.g. /metrics/gpu  /metrics/ssd  /metrics/cpu  /metrics/vllm  /metrics/telemetry
    location /metrics/ {
        rewrite ^/metrics/(.*)$ /api/v1/metrics/$1 break;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    # vLLM service debug/health access — path prefix stripped before forwarding
    # e.g. /llm-lmcache/v1/models  →  vllm-lmcache:8000/v1/models
    location /llm-lmcache/ {
        rewrite ^/llm-lmcache/(.*)$ /$1 break;
        set $lmcache http://vllm-lmcache:8000;
        proxy_pass $lmcache;
    }

    location /llm-baseline/ {
        rewrite ^/llm-baseline/(.*)$ /$1 break;
        set $baseline http://vllm-baseline:8000;
        proxy_pass $baseline;
    }

    location /vlm/ {
        rewrite ^/vlm/(.*)$ /$1 break;
        set $vlm http://vllm-vlm:8000;
        proxy_pass $vlm;
    }

    # Frontend — everything else goes to the UI
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
